version: '3.8'

services:
  resume-analyzer:
    build: .
    image: ai-resume-analyser:latest
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MAX_WORKERS=4
      - MAX_CONTENT_LENGTH=16777216
      - LOG_LEVEL=info
      - ANALYZERS=GPT
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3







